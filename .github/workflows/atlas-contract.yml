name: Canonical ontology and Atlas contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python scripts/generate-contract-registry.py --check
      - run: python scripts/validate-atlas-contract.py
